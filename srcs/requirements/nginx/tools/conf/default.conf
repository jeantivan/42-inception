# Sever HTTPS with TLS 1.3
server {
	listen 443 ssl;
	listen [::]:443 ssl;

	http2 on;

	server_name ${DOMAIN_NAME} www.${DOMAIN_NAME};

	# SSL certificate and key
	ssl_certificate /etc/nginx/ssl/${DOMAIN_NAME}.crt;
	ssl_certificate_key /etc/nginx/ssl/${DOMAIN_NAME}.key;

	ssl_protocols TLSv1.3;

	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 10m;
	ssl_session_tickets off;

	ssl_stapling on;
	ssl_stapling_verify on;
	ssl_trusted_certificate /etc/nginx/ssl/${DOMAIN_NAME}.crt;


	# HSTS (HTTP Strict Transport Security)
	# Uncomment only when you are sure about HTTPS configuration
	#add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

	# Content Security Policy (CSP)
	add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https:; frame-src 'self' https: blob:; worker-src 'self' blob:;" always;
	# Referrer Policy
	add_header Referrer-Policy 'strict-origin-when-cross-origin' always;

	# Permissions Policy
	add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

	# Connections with with WordPress image
	root /var/www/html;
	index index.php index.html index.htm;

	location / {
		try_files $uri $uri/ index.php?$args;
	}

	location ~ \.php$ {
		try_files $uri =404;
		fastcgi_split_path_info ^(.+\.php)(/.+)$;
		fastcgi_pass wordpress:9000;
		fastcgi_index index.php;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_param PATH_INFO $fastcgi_path_info;
	}

	# Configure Adminer access
	location = /adminer {
		return 301 /adminer/;
	}

	location /adminer/ {
		proxy_pass http://adminer:8080/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_redirect off;
	}

	# Configure access to static site
	location = /docs {
		return 301 /docs/;
	}

	location ^~ /docs/ {
		rewrite ^/docs/(.*)$ /$1 break;
		proxy_pass http://static_site:4321;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_redirect off;
		proxy_buffering off;
	}

	# Denied access to hidden files
	location ~ /\. {
		deny all;
		access_log off;
		log_not_found off;
	}


	# Cache static files
	location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
		expires 30d;
		add_header Cache-Control "public, immutable";
		access_log off;
	}

	# Health check endpoint
	location /healthz {
		access_log off;
		return 200 'Healthy\n';
		add_header Content-Type text/plain;
	}

	# Nginx status endpoint (for monitoring, only localhost)
	location /nginx_status {
		allow 127.0.0.1;
		deny all;
		stub_status on;
		access_log off;
	}

}
