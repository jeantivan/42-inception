# User and group (from Dockerfile)
user  nginx nginx;

# Worker processes
worker_processes  auto;

# Pid file
pid /var/run/nginx.pid;

# Events
events {
	# Max number of connections
	worker_connections  1024;

	# Use epoll on Linux systems
	use epoll;

	# Accept mutilple connections simultaneously
	multi_accept on;
}

# HTTP configuration
http {
	# Mime types
	include	   /etc/nginx/mime.types;
	default_type  application/octet-stream;

	# Log format
	log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
					  '$status $body_bytes_sent "$http_referer" '
					  '"$http_user_agent" "$http_x_forwarded_for"';

	# Logs
	access_log  /var/log/nginx/access.log  main;
	error_log   /var/log/nginx/error.log warn;

	# Performance settings

	# Send files efficiently
	sendfile        on;

	# Send headers in one packet
	tcp_nopush     on;

	# Don't do buffering on small packets
	tcp_nodelay    on;

	# Keep connections alive
	keepalive_timeout  65;

	# Timeouts
	client_body_timeout   12; # Request body timeout
	client_header_timeout 12; # Request header timeout
	send_timeout          10; # Response timeout

	# Size limits
	client_max_body_size 20M; # Max body size (uploads)
	client_body_buffer_size 128k; # Buffer size for client body

	# Gzip compression
	gzip  on;
	gzip_vary  on;
	gzip_proxied  any;
	gzip_comp_level  6;
	gzip_types
		text/plain
		text/css
		text/xml
		text/javascript
		application/json
		application/javascript
		application/xml
		application/xml+rss
		font/truetype
		font/opentype
		application/vnd.ms-fontobject
		image/svg+xml;
	gzip_disable "msie6";

	# Security headers

	# Hide nginx version
	server_tokens off;

	# Prevent clickjacking
	add_header X-Frame-Options "SAMEORIGIN" always;

	# Prevent MIME-type sniffing
	add_header X-Content-Type-Options "nosniff" always;

	# XSS protection
	add_header X-XSS-Protection "1; mode=block" always;

	# SSL/TLS global settings

	# Protocols
	ssl_protocols TLSv1.3;

	# Prefer server ciphers
	ssl_prefer_server_ciphers on;

	# SSL session settings
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 10m;
	ssl_session_tickets off;

	# DH paramameters (script generated)
	# ssl_dhparam /etc/nginx/ssl/dhparam.pem;

	# OCSP stapling
	ssl_stapling on;
	ssl_stapling_verify on;
	resolver 8.8.8.8 8.8.4.4 valid=300s;
	resolver_timeout 5s;

	# Include additional configurations
	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;

}


